name: tumorfs
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy>=1.21
  - pandas>=1.3
  - scipy>=1.7
  - scikit-learn>=1.0
  - matplotlib>=3.5
  - seaborn>=0.11
  - plotly>=5.0
  - pyyaml>=6.0
  - tqdm>=4.60
  - joblib>=1.1
  - pip:
    - lightgbm>=3.3
    - xgboost>=1.6
    - catboost>=1.0
    - boruta>=0.3
    - skrebate>=0.62
    - arfs>=1.0
    - imbalanced-learn>=0.9
    - git+https://github.com/jundongl/scikit-feature.git
    - -e .
